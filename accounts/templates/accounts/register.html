
{% extends "accounts/base.html" %}

{% block title %}Registration | Lab 4{% endblock %}

{% block content %}
<h1>Create an account</h1>
<p>Register to access the report dashboard.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login here</a>
</p>
{% endblock %}
